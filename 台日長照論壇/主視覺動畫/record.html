<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>2026臺中長照台日論壇 — 動態主視覺（渲染版 v2）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#143a78; --navy-deep:#0a2150; --navy-lite:#2f63b4;
    --gold-1:#eccb79; --gold-2:#b8893a; --gold-hi:#fff3cf;
    --pad-x:80px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1920px;height:1080px;background:#06122e;overflow:hidden}
  body{font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;}

  /* ---------- 背景：底圖 + 推鏡 ---------- */
  #bgwrap{position:absolute;inset:0;overflow:hidden;}
  #bg{position:absolute;inset:-3%;width:106%;height:106%;
      background:url('bg-final.jpg') center/cover no-repeat;
      transform-origin:62% 42%;will-change:transform;}
  /* 天空陽光輝光（緩慢呼吸） */
  #sun{position:absolute;left:-8%;top:-12%;width:62%;height:58%;
       background:radial-gradient(ellipse at 30% 30%,rgba(255,249,225,.45),rgba(255,249,225,0) 60%);
       mix-blend-mode:screen;will-change:opacity;}
  /* 飄移雲霧 */
  .cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,.5),rgba(255,255,255,0));
         mix-blend-mode:screen;filter:blur(8px);will-change:transform,opacity;}
  /* 金色微粒 */
  #dust{position:absolute;inset:0;pointer-events:none;}
  .pt{position:absolute;border-radius:50%;
      background:radial-gradient(closest-side,#fff7e0,rgba(255,216,130,.85),rgba(255,205,110,0));
      filter:drop-shadow(0 0 6px rgba(255,214,140,.7));will-change:transform,opacity;}
  /* 暈影增加層次 */
  #vig{position:absolute;inset:0;pointer-events:none;
       background:radial-gradient(120% 120% at 50% 42%,rgba(0,0,0,0) 62%,rgba(4,12,40,.22) 100%);}

  /* ---------- 文字 ---------- */
  #txt{position:absolute;inset:0;}
  .row{position:absolute;left:var(--pad-x);white-space:nowrap;line-height:1;
       will-change:transform,opacity,clip-path;}

  #gold{top:60px;font-size:64px;font-weight:900;letter-spacing:3px;
        background:linear-gradient(96deg,var(--gold-2),var(--gold-1) 42%,var(--gold-hi) 56%,var(--gold-1) 70%,var(--gold-2));
        -webkit-background-clip:text;background-clip:text;color:transparent;
        filter:drop-shadow(0 1px 1px rgba(60,40,0,.18));}
  #rule{top:138px;left:var(--pad-x);height:4px;width:404px;border-radius:2px;
        background:linear-gradient(90deg,var(--gold-2),var(--gold-1) 60%,var(--gold-hi));
        transform-origin:left center;}

  /* 主標：實色深藍（穩定渲染）+ 投影做厚度 */
  .title{font-weight:900;color:#173c79;
         filter:drop-shadow(0 4px 16px rgba(8,22,60,.22));}
  /* 金光掃過：覆蓋在標題上的亮帶，用文字做遮罩 */
  .glint{position:absolute;left:var(--pad-x);font-weight:900;pointer-events:none;
         color:transparent;background-clip:text;-webkit-background-clip:text;
         background-image:linear-gradient(100deg,transparent 0 42%,rgba(255,255,255,.95) 50%,transparent 58% 100%);
         background-size:260% 100%;background-repeat:no-repeat;background-position:170% 0;
         will-change:background-position,opacity;}
  #g1{top:172px;font-size:160px;letter-spacing:4px;}
  #g2{top:336px;font-size:104px;letter-spacing:3px;}
  #t1{top:172px;font-size:160px;letter-spacing:4px;}
  #t2{top:336px;font-size:104px;letter-spacing:3px;}
  .ch{display:inline-block;will-change:transform,opacity,clip-path;}

  #sub{top:452px;font-size:42px;font-weight:700;color:#163b78;letter-spacing:2px;}
  #sub .x{color:var(--gold-2);font-weight:900;margin:0 10px;}

  .info{display:flex;align-items:center;gap:20px;font-weight:700;color:#163b78;}
  #date{top:520px;font-size:46px;}
  #loc{top:600px;font-size:46px;}
  .info .num{color:var(--navy-lite);font-weight:900;}
  .info .sp{display:inline-block;width:30px;}
  .ico{flex:0 0 auto;width:60px;height:60px;border-radius:50%;
       border:3px solid var(--gold-2);display:flex;align-items:center;justify-content:center;
       background:rgba(255,255,255,.25);will-change:transform,opacity;}
  .ico svg{width:56%;height:56%;stroke:#163b78;stroke-width:2.2;fill:none;
           stroke-linecap:round;stroke-linejoin:round;}

  /* 右下角報名 QR */
  #qr{position:absolute;right:150px;top:44px;width:164px;
      background:#fff;border-radius:16px;padding:11px 11px 7px;
      box-shadow:0 10px 30px rgba(4,12,40,.45);text-align:center;}
  #qr img{width:100%;display:block;border-radius:5px}
  #qr .lab{margin-top:6px;font-weight:900;font-size:20px;color:#12305f;letter-spacing:3px}
</style>
</head>
<body>
  <div id="stage">
    <div id="bgwrap">
      <div id="bg"></div>
      <div id="sun"></div>
      <div class="cloud" id="cl1" style="left:8%;top:6%;width:520px;height:240px;"></div>
      <div class="cloud" id="cl2" style="left:46%;top:2%;width:680px;height:260px;"></div>
      <div id="dust"></div>
      <div id="vig"></div>
    </div>
    <div id="txt">
      <div class="row" id="gold">2026臺中長照台日論壇</div>
      <div class="row" id="rule"></div>
      <div class="row title" id="t1"><span class="ch">跨</span><span class="ch">域</span><span class="ch">共</span><span class="ch">融</span></div>
      <div class="row title" id="t2"><span class="ch">智</span><span class="ch">啟</span><span class="ch">長</span><span class="ch">照</span><span class="ch">新</span><span class="ch">時</span><span class="ch">代</span></div>
      <div class="glint" id="g1">跨域共融</div>
      <div class="glint" id="g2">智啟長照新時代</div>
      <div class="row" id="sub">跨域協作<span class="x">×</span>智慧創新<span class="x">×</span>在地實踐<span class="x">×</span>國際共享</div>
      <div class="row info" id="date">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span>
        <span class="t"><span class="num">115</span>年<span class="num">7</span>月<span class="num">3</span>日（五）<span class="sp"></span><span class="num">9:00-16:30</span></span>
      </div>
      <div class="row info" id="loc">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
        <span class="t">裕元花園酒店 B1 國際演講廳</span>
      </div>
    </div>
    <div id="qr"><img src="qrcode.png" alt="報名QR"><div class="lab">活動報名</div></div>
  </div>

<script>
const T = 20000;                       // 20 秒無縫循環
const ANIMS = [];
const EASE   = 'cubic-bezier(.16,.84,.3,1)';
const EASEO  = 'cubic-bezier(.4,0,.2,1)';
const OUT_START = 17000, OUT_DUR = 1700;
const off = t => Math.max(0, Math.min(1, t/T));
function add(a){ a.pause(); ANIMS.push(a); return a; }

/* 文字：進場 → 停留 → 淡出（單一 20s 關鍵影格，首尾相同→無縫） */
function reveal(el, {start, dur, type, outStart=OUT_START, outDur=OUT_DUR}){
  let enter, exit;
  if(type==='rise'){
    enter={opacity:[0,1], transform:['translateY(38px)','translateY(0)']};
    exit ={opacity:[1,0], transform:['translateY(0)','translateY(-20px)']};
  }else if(type==='maskup'){            // 由下往上遮罩揭開（優雅）
    enter={opacity:[1,1], clipPath:['inset(105% 0 -5% 0)','inset(0% 0 0% 0)'], transform:['translateY(14px)','translateY(0)']};
    exit ={opacity:[1,0], transform:['translateY(0)','translateY(-14px)']};
  }else if(type==='wipe'){
    enter={opacity:[1,1], clipPath:['inset(0 100% 0 0)','inset(0 0 0 0)']};
    exit ={opacity:[1,0]};
  }else if(type==='rule'){
    enter={opacity:[1,1], transform:['scaleX(0)','scaleX(1)']};
    exit ={opacity:[1,0]};
  }else if(type==='pop'){
    enter={opacity:[0,1], transform:['scale(.84)','scale(1)']};
    exit ={opacity:[1,0], transform:['scale(1)','scale(.95)']};
  }
  const s0=off(start), s1=off(start+dur), o0=off(outStart), o1=off(outStart+outDur);
  const A=Object.fromEntries(Object.entries(enter).map(([k,v])=>[k,v[0]]));
  const B=Object.fromEntries(Object.entries(enter).map(([k,v])=>[k,v[1]]));
  const C=Object.fromEntries(Object.entries(exit ).map(([k,v])=>[k,v[1]]));
  const kf=[{offset:0,...A,easing:EASE},{offset:s0,...A,easing:EASE},
            {offset:s1,...B,easing:EASEO},{offset:o0,...B,easing:EASEO},
            {offset:o1,...C},{offset:1,...A}];
  return add(el.animate(kf,{duration:T,iterations:Infinity}));
}

/* ---- 背景生命力 ---- */
// 推鏡（yo-yo，首尾相同）
add(document.getElementById('bg').animate(
  [{transform:'scale(1.0) translate(0,0)'},
   {transform:'scale(1.05) translate(-0.8%,-0.6%)',offset:.5},
   {transform:'scale(1.0) translate(0,0)'}],
  {duration:T,iterations:Infinity,easing:'ease-in-out'}));
// 陽光呼吸
add(document.getElementById('sun').animate(
  [{opacity:.55},{opacity:.95,offset:.5},{opacity:.55}],
  {duration:T,iterations:Infinity,easing:'ease-in-out'}));
// 雲霧飄移（正弦，seamless）
function drift(el,ax,ay,o1,o2){
  return add(el.animate(
    [{transform:'translate(0,0)',opacity:o1},
     {transform:`translate(${ax}px,${ay}px)`,opacity:o2,offset:.5},
     {transform:'translate(0,0)',opacity:o1}],
    {duration:T,iterations:Infinity,easing:'ease-in-out'}));
}
drift(document.getElementById('cl1'),140,18,.30,.55);
drift(document.getElementById('cl2'),-120,12,.22,.45);

// 金色微粒
const dust=document.getElementById('dust');
const RND=(s)=>{let x=Math.sin(s)*43758.5453;return x-Math.floor(x);};
const N=34;
for(let i=0;i<N;i++){
  const p=document.createElement('div'); p.className='pt';
  const sz=5+RND(i*1.7)*11;
  p.style.width=p.style.height=sz+'px';
  // 多數落在上方天空與右側建築，避免擋住左側文字
  const x=RND(i*2.3)*1820+40, y=RND(i*3.1)*760+60;
  p.style.left=x+'px'; p.style.top=y+'px';
  p.style.opacity=0;
  dust.appendChild(p);
  const ax=(RND(i*4.7)-.5)*150, ay=-50-RND(i*5.3)*150;
  const peak=.45+RND(i*6.1)*.5;
  add(p.animate(
    [{transform:'translate(0,0)',opacity:0},
     {opacity:peak,offset:.16},
     {transform:`translate(${ax}px,${ay}px)`,opacity:peak,offset:.5,easing:'linear'},
     {opacity:peak,offset:.84},
     {transform:`translate(${ax*1.7}px,${ay*1.9}px)`,opacity:0}],
    {duration:T,iterations:Infinity,easing:'linear'}));
}

/* ---- 文字進場時序 ---- */
reveal(document.getElementById('gold'),{start:800,dur:820,type:'rise'});
reveal(document.getElementById('rule'),{start:1150,dur:760,type:'rule'});
document.querySelectorAll('#t1 .ch').forEach((c,i)=>reveal(c,{start:1700+i*135,dur:720,type:'maskup'}));
document.querySelectorAll('#t2 .ch').forEach((c,i)=>reveal(c,{start:2950+i*95,dur:640,type:'maskup'}));
reveal(document.getElementById('sub'),{start:4500,dur:1100,type:'wipe'});
reveal(document.querySelector('#date .ico'),{start:5200,dur:560,type:'rise'});
reveal(document.querySelector('#date .t'),{start:5400,dur:760,type:'rise'});
reveal(document.querySelector('#loc .ico'),{start:5900,dur:560,type:'rise'});
reveal(document.querySelector('#loc .t'),{start:6100,dur:760,type:'rise'});
/* QR：全程固定在右上角，不做進出場動畫 */

/* 標題金光掃過（疊字遮罩層）：進場後掃 1 次 + 停留中掃 1 次 */
function glint(el){
  return add(el.animate(
    [{backgroundPosition:'170% 0',opacity:0},
     {backgroundPosition:'170% 0',opacity:0,offset:.215},   // 第一次 約 4.3s
     {backgroundPosition:'170% 0',opacity:1,offset:.22},
     {backgroundPosition:'-70% 0',opacity:1,offset:.31,easing:'cubic-bezier(.4,0,.3,1)'},
     {backgroundPosition:'-70% 0',opacity:0,offset:.315},
     {backgroundPosition:'170% 0',opacity:0,offset:.575},   // 第二次 約 11.5s
     {backgroundPosition:'170% 0',opacity:1,offset:.58},
     {backgroundPosition:'-70% 0',opacity:1,offset:.67,easing:'cubic-bezier(.4,0,.3,1)'},
     {backgroundPosition:'-70% 0',opacity:0,offset:.675},
     {backgroundPosition:'170% 0',opacity:0}],
    {duration:T,iterations:Infinity}));
}
glint(document.getElementById('g1'));
glint(document.getElementById('g2'));

/* ---- 渲染介面 ---- */
window.seek = (ms)=>{ const t=((ms%T)+T)%T; ANIMS.forEach(a=>{ a.currentTime=t; }); };
window.TOTAL = T;
window.seek(0);
</script>
</body>
</html>
