<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026臺中長照台日論壇 — 主視覺動態循環</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* ---- 設計舞台 1920x1080，所有座標以此為基準 ---- */
    --navy:#143a78;            /* 主標深藍 */
    --navy-deep:#0a2150;       /* 漸層暗端 */
    --navy-lite:#2f63b4;       /* 數字/亮藍 */
    --gold-1:#e7c878;          /* 金 亮 */
    --gold-2:#b8893a;          /* 金 暗 */
    --pad-x:80px;              /* 左側對齊線 */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;background:#06122e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
       font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;}

  /* 舞台：固定 1920x1080，依視窗等比縮放鋪滿 */
  #stage{position:relative;width:1920px;height:1080px;overflow:hidden;
         transform-origin:center center;}
  #bgwrap{position:absolute;inset:0;overflow:hidden;}
  #bg{position:absolute;inset:-2%;width:104%;height:104%;
      background:url('bg-clean.jpg') center/cover no-repeat;
      transform-origin:60% 45%;}
  /* 校位用原稿（?align=1 時顯示） */
  #bg-ref{position:absolute;inset:0;width:100%;height:100%;
          background:url('bg-original.jpg') center/cover no-repeat;
          opacity:0;pointer-events:none;}
  body.align #bg-ref{opacity:.5}

  /* ---- 文字層 ---- */
  #txt{position:absolute;inset:0;}
  .row{position:absolute;left:var(--pad-x);white-space:nowrap;
       will-change:transform,opacity;}

  /* 金字小標 */
  #gold{top:64px;font-size:62px;font-weight:900;letter-spacing:4px;
        background:linear-gradient(100deg,var(--gold-2),var(--gold-1) 45%,#fff5d6 60%,var(--gold-2));
        -webkit-background-clip:text;background-clip:text;color:transparent;
        text-shadow:0 1px 0 rgba(0,0,0,.12);}
  #rule{top:124px;left:var(--pad-x);height:4px;width:392px;
        background:linear-gradient(90deg,var(--gold-2),var(--gold-1));
        transform-origin:left center;border-radius:2px;}

  /* 主標 */
  .title{font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;
          font-weight:900;color:var(--navy);
          background:linear-gradient(180deg,#1c4d96,var(--navy-deep));
          -webkit-background-clip:text;background-clip:text;
          text-shadow:0 3px 14px rgba(8,24,64,.18);}
  #t1{top:146px;font-size:168px;letter-spacing:10px;}
  #t2{top:316px;font-size:100px;letter-spacing:6px;}
  .ch{display:inline-block;will-change:transform,opacity,filter;}

  /* 副標 */
  #sub{top:430px;font-size:44px;font-weight:700;color:var(--navy);
       letter-spacing:2px;overflow:hidden;}
  #sub .x{color:var(--gold-2);font-weight:900;margin:0 6px;}

  /* 日期 / 地點 */
  .info{display:flex;align-items:center;gap:22px;font-weight:700;color:var(--navy);}
  #date{top:506px;font-size:48px;}
  #loc{top:586px;font-size:50px;}
  .info .num{color:var(--navy-lite);font-weight:900;}
  .info .sp{display:inline-block;width:30px;}
  .ico{flex:0 0 auto;width:62px;height:62px;border-radius:50%;
       border:3px solid var(--gold-2);display:flex;align-items:center;justify-content:center;
       color:var(--navy);will-change:transform,opacity;}
  #loc .ico{width:56px;height:56px}
  .ico svg{width:55%;height:55%;stroke:var(--navy);stroke-width:2.2;fill:none}

  /* 校位輔助線 */
  body.align #txt .row{outline:1px dashed rgba(255,0,0,.5)}
  #hint{position:fixed;left:8px;bottom:6px;font:12px/1.4 monospace;color:#fff;
        background:rgba(0,0,0,.45);padding:3px 7px;border-radius:5px;z-index:9;opacity:0;}
  body.align #hint{opacity:1}
</style>
</head>
<body>
  <div id="stage">
    <div id="bgwrap"><div id="bg"></div><div id="bg-ref"></div></div>
    <div id="txt">
      <div class="row" id="gold">2026臺中長照台日論壇</div>
      <div class="row" id="rule"></div>
      <div class="row title" id="t1"><span class="ch">跨</span><span class="ch">域</span><span class="ch">共</span><span class="ch">融</span></div>
      <div class="row title" id="t2"><span class="ch">智</span><span class="ch">啟</span><span class="ch">長</span><span class="ch">照</span><span class="ch">新</span><span class="ch">時</span><span class="ch">代</span></div>
      <div class="row" id="sub">跨域協作<span class="x">×</span>智慧創新<span class="x">×</span>在地實踐<span class="x">×</span>國際共享</div>
      <div class="row info" id="date">
        <span class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></svg></span>
        <span><span class="num">115</span>年<span class="num">7</span>月<span class="num">3</span>日（五）<span class="sp"></span><span class="num">9:00-16:30</span></span>
      </div>
      <div class="row info" id="loc">
        <span class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></span>
        <span>裕元花園酒店 B1 國際演講廳</span>
      </div>
    </div>
    <div id="hint"></div>
  </div>

<script>
const T = 14000;                 // 循環總長 (ms)
const stage = document.getElementById('stage');
const EASE = 'cubic-bezier(.16,.84,.3,1)';
const EASE_OUT = 'cubic-bezier(.4,0,.2,1)';

/* 等比縮放舞台鋪滿視窗 */
function fit(){
  const s = Math.min(innerWidth/1920, innerHeight/1080);
  stage.style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();

/* 校位模式 */
if (new URLSearchParams(location.search).get('align')==='1'){
  document.body.classList.add('align');
}

const OUT_START = 11400, OUT_DUR = 1600;   // 全體淡出
const off = t => Math.max(0, Math.min(1, t/T));

/* 進場→停留→淡出 的循環關鍵影格 */
function animate(el, {start, dur, type, outStart=OUT_START, outDur=OUT_DUR}){
  let enter, exit;
  if(type==='up'){
    enter = {opacity:[0,1], transform:['translateY(46px)','translateY(0)'], filter:['blur(6px)','blur(0)']};
    exit  = {opacity:[1,0], transform:['translateY(0)','translateY(-22px)'], filter:['blur(0)','blur(3px)']};
  }else if(type==='pop'){
    enter = {opacity:[0,1], transform:['scale(.5) rotate(-8deg)','scale(1) rotate(0)']};
    exit  = {opacity:[1,0], transform:['scale(1)','scale(1.15)']};
  }else if(type==='wipe'){
    enter = {opacity:[1,1], clipPath:['inset(0 100% 0 0)','inset(0 0 0 0)']};
    exit  = {opacity:[1,0]};
  }else if(type==='rule'){
    enter = {opacity:[1,1], transform:['scaleX(0)','scaleX(1)']};
    exit  = {opacity:[1,0]};
  }
  // 建立 0..1 關鍵影格序列
  const kf = [];
  const s0=off(start), s1=off(start+dur), o0=off(outStart), o1=off(outStart+outDur);
  const startState = Object.fromEntries(Object.entries(enter).map(([k,v])=>[k,v[0]]));
  const fullState  = Object.fromEntries(Object.entries(enter).map(([k,v])=>[k,v[1]]));
  const exitState  = Object.fromEntries(Object.entries(exit ).map(([k,v])=>[k,v[1]]));
  kf.push({offset:0, ...startState, easing:EASE});
  kf.push({offset:s0, ...startState, easing:EASE});
  kf.push({offset:s1, ...fullState, easing:EASE_OUT});
  kf.push({offset:o0, ...fullState, easing:EASE_OUT});
  kf.push({offset:o1, ...exitState});
  kf.push({offset:1,  ...startState});
  el.animate(kf, {duration:T, iterations:Infinity});
}

/* 背景緩慢呼吸縮放（首尾相同→無縫循環） */
document.getElementById('bg').animate(
  [{transform:'scale(1)'},{transform:'scale(1.055)',offset:.5},{transform:'scale(1)'}],
  {duration:T, iterations:Infinity, easing:'ease-in-out'}
);

/* 進場時序表 */
animate(document.getElementById('gold'), {start:600,  dur:760, type:'up'});
animate(document.getElementById('rule'), {start:1000, dur:700, type:'rule'});

const t1 = document.querySelectorAll('#t1 .ch');
t1.forEach((c,i)=>animate(c, {start:1300+i*120, dur:640, type:'up'}));
const t2 = document.querySelectorAll('#t2 .ch');
t2.forEach((c,i)=>animate(c, {start:2350+i*90, dur:560, type:'up'}));

animate(document.getElementById('sub'),  {start:3550, dur:1000, type:'wipe'});

animate(document.querySelector('#date .ico'), {start:4050, dur:520, type:'pop'});
animate(document.querySelector('#date span:last-child'), {start:4250, dur:720, type:'up'});
animate(document.querySelector('#loc .ico'),  {start:4650, dur:520, type:'pop'});
animate(document.querySelector('#loc span:last-child'),  {start:4850, dur:720, type:'up'});

/* 校位資訊 */
const hint=document.getElementById('hint');
if(document.body.classList.contains('align')){
  setInterval(()=>{ hint.textContent='ALIGN MODE  loop '+T+'ms  scale '+(stage.style.transform); },300);
}
</script>
</body>
</html>
