<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>2026臺中長照台日論壇 — 動態主視覺（循環播放）</title>
<style>
  html,body{margin:0;height:100%;background:#06122e;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;object-fit:contain;background:#06122e}
  #hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
        font:15px/1 "Microsoft JhengHei",sans-serif;color:#fff;background:rgba(0,0,0,.45);
        padding:8px 14px;border-radius:20px;cursor:pointer;transition:opacity .4s}
</style>
</head>
<body>
  <video id="v" src="2026台日論壇_動態主視覺_1920x1080.mp4" autoplay loop muted playsinline></video>
  <div id="hint">▶ 點一下開始 / 按 F11 全螢幕</div>
<script>
  const v=document.getElementById('v'), h=document.getElementById('hint');
  v.play().then(()=>{ h.style.opacity=0; setTimeout(()=>h.remove(),600); }).catch(()=>{});
  document.body.addEventListener('click',()=>{ v.play(); h.style.opacity=0; });
</script>
</body>
</html>
