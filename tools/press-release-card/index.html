<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>新聞稿圖卡產生器 — 公傳室</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b25;
      --card: #1c2232;
      --border: #253050;
      --accent: #4f8ef7;
      --accent2: #3ecf8e;
      --accent3: #f5a623;
      --accent4: #c47af7;
      --text: #e2e8f5;
      --muted: #6b7a9e;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 20px 100px;
    }

    h1 {
      max-width: 1040px;
      margin: 0 auto 6px;
      font-size: 1.3rem;
      font-weight: 700;
    }
    h1 span { color: var(--accent2); }

    .subtitle {
      max-width: 1040px;
      margin: 0 auto 24px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .layout {
      max-width: 1040px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 720px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    label span.req { color: var(--accent3); margin-left: 2px; }

    input[type="text"], input[type="date"], textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 9px 12px;
      font-family: inherit;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, input[type="date"]:focus,
    textarea:focus, select:focus {
      border-color: var(--accent);
    }
    input[type="date"] { color-scheme: dark; }

    select option { background: var(--card); }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 配色主題 */
    .color-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .color-option {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      transition: border-color 0.15s;
      font-size: 0.82rem;
      user-select: none;
    }
    .color-option:hover { border-color: var(--accent); }
    .color-option input[type="radio"] { display: none; }
    .color-option.selected { border-color: var(--accent); background: rgba(79,142,247,0.08); }

    .swatch {
      width: 18px; height: 18px;
      border-radius: 50%; flex-shrink: 0;
    }
    .sw-blue   { background: linear-gradient(135deg, #1a4b8c, #2b6cb0); }
    .sw-teal   { background: linear-gradient(135deg, #1a9c8a, #2b6cb0); }
    .sw-gray   { background: linear-gradient(135deg, #2d3d55, #4a5568); }
    .sw-warm   { background: linear-gradient(135deg, #c8a84b, #e8d080); }

    /* 格式選擇 */
    .format-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .fmt-option {
      cursor: pointer;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
      transition: border-color 0.15s;
      user-select: none;
    }
    .fmt-option:hover { border-color: var(--accent); }
    .fmt-option input[type="checkbox"] { display: none; }
    .fmt-option.selected { border-color: var(--accent); background: rgba(79,142,247,0.08); }
    .fmt-thumb {
      margin: 0 auto 5px;
      background: var(--muted);
      border-radius: 3px;
      opacity: 0.5;
      transition: opacity 0.15s;
    }
    .fmt-option.selected .fmt-thumb { opacity: 1; background: var(--accent); }
    .fmt-name { font-size: 0.8rem; font-weight: 700; color: var(--text); }
    .fmt-desc { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }

    /* 輸出區 */
    .output-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.82rem;
      line-height: 1.75;
      color: #a8b5d0;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 380px;
      overflow-y: auto;
      font-family: "Cascadia Code", "Fira Code", "Courier New", monospace;
    }
    .output-placeholder {
      color: var(--muted);
      font-style: italic;
      font-family: inherit;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent2); color: #0d1117; }
    .btn-secondary { background: var(--accent); color: #0d1117; }
    .btn-copy { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-copy.copied { border-color: var(--accent2); color: var(--accent2); }
    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* 貼入新聞稿快捷 */
    .paste-hint {
      font-size: 0.76rem;
      color: var(--muted);
      margin-top: 4px;
    }
    .paste-hint button {
      background: none; border: none;
      color: var(--accent); font-size: inherit;
      cursor: pointer; text-decoration: underline;
      font-family: inherit; padding: 0;
    }

    /* 區段分隔 */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0;
    }

    /* 提示說明 */
    .tip {
      font-size: 0.76rem;
      color: var(--muted);
      line-height: 1.6;
      background: rgba(79,142,247,0.06);
      border: 1px solid rgba(79,142,247,0.15);
      border-radius: 8px;
      padding: 10px 12px;
    }
    .tip strong { color: var(--accent); }

    /* 返回按鈕 */
    .back-btn {
      position: fixed;
      bottom: 20px; left: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 8px 14px;
      transition: color 0.15s, border-color 0.15s;
      z-index: 100;
    }
    .back-btn:hover { color: var(--text); border-color: var(--accent); }

    /* 自動提取按鈕 */
    .extract-row {
      display: flex; align-items: flex-end; gap: 8px;
    }
    .extract-row > div { flex: 1; }
    .btn-extract {
      padding: 9px 14px;
      background: rgba(79,142,247,0.12);
      border: 1px solid rgba(79,142,247,0.3);
      border-radius: 8px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      transition: background 0.15s;
      flex-shrink: 0;
      align-self: flex-end;
    }
    .btn-extract:hover { background: rgba(79,142,247,0.2); }
  </style>
</head>
<body>

<h1>📰 新聞稿<span>圖卡</span>產生器</h1>
<p class="subtitle">填入新聞稿資料 → 生成設計提示詞 → 貼到 Claude／Gemini／GPT 取得圖卡內容與設計建議</p>

<div class="layout">

  <!-- 左：輸入 -->
  <div class="panel">
    <div class="panel-title">新聞稿資料</div>

    <!-- 快捷：貼入全文自動提取 -->
    <div>
      <label>新聞稿全文（可貼入後自動提取）</label>
      <textarea id="full-text" rows="5" placeholder="將新聞稿全文貼在這裡，按「自動提取」即可填好以下欄位…"></textarea>
      <div class="paste-hint">
        <button onclick="autoExtract()">⚡ 自動提取標題 / 日期 / 重點</button>（之後仍可手動微調）
      </div>
    </div>

    <hr class="divider">

    <!-- 標題 -->
    <div>
      <label>新聞標題<span class="req">*</span></label>
      <input type="text" id="title" placeholder="例：慈濟醫院首創無縫照護模式 嘉惠百位長者" />
    </div>


    <!-- 新聞重點 -->
    <div>
      <label>新聞重點 <small style="font-size:0.78rem;color:var(--muted)">（每行一點，3–5 點最佳）</small></label>
      <textarea id="points" rows="5" placeholder="例：&#10;首例達文西機器手臂微創腎切除手術&#10;失血量不到傳統手術的五分之一&#10;住院天數縮短至 3 天，術後疼痛明顯減輕&#10;患者術後 1 週恢復正常工作"></textarea>
    </div>

    <!-- 金句 -->
    <div>
      <label>關鍵金句／引言 <small style="font-size:0.78rem;color:var(--muted)">（選填，會放在圖卡顯眼處）</small></label>
      <input type="text" id="quote" placeholder="例：「用愛守護每一個生命，我們從不停歇。」— 陳院長" />
    </div>

    <hr class="divider">

    <!-- 格式 -->
    <div>
      <label>圖卡格式 <small style="font-size:0.78rem;color:var(--muted)">（可複選）</small></label>
      <div class="format-options" id="formatOptions">
        <label class="fmt-option selected" onclick="toggleFmt(this)">
          <input type="checkbox" value="4:3 橫式（1200×900px，新聞圖卡）" checked>
          <div class="fmt-thumb" style="width:52px;height:39px;"></div>
          <div class="fmt-name">4:3 橫式</div>
          <div class="fmt-desc">新聞圖卡</div>
        </label>
        <label class="fmt-option" onclick="toggleFmt(this)">
          <input type="checkbox" value="1:1 方形（1080×1080px，IG 貼文）">
          <div class="fmt-thumb" style="width:40px;height:40px;"></div>
          <div class="fmt-name">1:1 方形</div>
          <div class="fmt-desc">IG 貼文</div>
        </label>
        <label class="fmt-option" onclick="toggleFmt(this)">
          <input type="checkbox" value="16:9 橫式（1200×675px，FB 封面）">
          <div class="fmt-thumb" style="width:56px;height:32px;"></div>
          <div class="fmt-name">16:9 橫式</div>
          <div class="fmt-desc">FB 封面</div>
        </label>
        <label class="fmt-option" onclick="toggleFmt(this)">
          <input type="checkbox" value="9:16 直式（1080×1920px，限時動態）">
          <div class="fmt-thumb" style="width:28px;height:50px;"></div>
          <div class="fmt-name">9:16 直式</div>
          <div class="fmt-desc">限時動態</div>
        </label>
      </div>
    </div>

    <!-- 配色 -->
    <div>
      <label>配色主題</label>
      <div class="color-options" id="colorOptions">
        <label class="color-option selected" onclick="selectColor(this)">
          <input type="radio" name="color" value="慈濟深藍（沉穩專業）" checked>
          <span class="swatch sw-blue"></span>慈濟深藍
        </label>
        <label class="color-option" onclick="selectColor(this)">
          <input type="radio" name="color" value="藍綠雙色（清新信任）">
          <span class="swatch sw-teal"></span>藍綠雙色
        </label>
        <label class="color-option" onclick="selectColor(this)">
          <input type="radio" name="color" value="深灰現代（簡約俐落）">
          <span class="swatch sw-gray"></span>深灰現代
        </label>
        <label class="color-option" onclick="selectColor(this)">
          <input type="radio" name="color" value="金邊典雅（莊重正式）">
          <span class="swatch sw-warm"></span>金邊典雅
        </label>
      </div>
    </div>

    <!-- 設計風格 -->
    <div class="row-2">
      <div>
        <label>設計風格</label>
        <select id="design-style">
          <option value="資訊圖表風（圖示 + 數字 + 條列）" selected>資訊圖表風</option>
          <option value="新聞專業風（大標題 + 重點條列 + 照片空間）">新聞專業風</option>
          <option value="簡約現代風（大量留白 + 清晰層次）">簡約現代風</option>
          <option value="雜誌封面風（全版底圖 + 大字標題）">雜誌封面風</option>
        </select>
      </div>
      <div>
        <label>重點數量</label>
        <select id="point-count">
          <option value="3">3 點</option>
          <option value="4" selected>4 點</option>
          <option value="5">5 點</option>
        </select>
      </div>
    </div>

    <div>
      <label>圖卡數量</label>
      <div class="row-2">
        <label class="color-option selected" onclick="selectCardCount(this)" style="justify-content:center;">
          <input type="radio" name="card-count" value="1" checked>1 張
        </label>
        <label class="color-option" onclick="selectCardCount(this)" style="justify-content:center;">
          <input type="radio" name="card-count" value="2">2 張
        </label>
        <label class="color-option" onclick="selectCardCount(this)" style="justify-content:center;">
          <input type="radio" name="card-count" value="3">3 張
        </label>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="generate()">🪄 產生提示詞</button>
      <button class="btn btn-copy" onclick="clearAll()">清除</button>
    </div>
  </div>

  <!-- 右：輸出 -->
  <div class="panel">
    <div class="panel-title">產生的提示詞</div>
    <div class="output-box" id="output">
      <span class="output-placeholder">填入左側新聞稿資料後，點「產生提示詞」按鈕。

複製後貼到 Claude、Gemini 或 GPT，AI 會幫你：
  1. 整理圖卡標題與重點文字
  2. 建議版面配置與設計細節
  3. 輸出完整的圖卡文字稿

再將文字稿帶入 Canva / Figma 製作圖卡。</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-copy" id="copyBtn" onclick="copyPrompt()" disabled>複製提示詞</button>
      <button class="btn btn-secondary" id="copyCardBtn" onclick="copyCardPrompt()" disabled style="display:none;">複製圖卡文字稿</button>
    </div>
    <div class="tip">
      💡 <strong>使用流程：</strong>複製提示詞 → 貼到任意 AI 對話 → AI 輸出圖卡文字稿與設計建議 → 帶入 Canva/Figma 製作 → 完成！
    </div>
  </div>

</div>

<a class="back-btn" href="../pr-dashboard/index.html">← 儀表板</a>

<script>
  let generatedPrompt = '';

  // ── 自動提取 ──────────────────────────────────────
  function autoExtract() {
    const raw = document.getElementById('full-text').value.trim();
    if (!raw) { alert('請先貼入新聞稿全文'); return; }

    const lines = raw.split('\n').map(l => l.trim()).filter(Boolean);

    // 標題：第一行夠長、不含網址的行
    let title = '';
    for (const l of lines) {
      if (l.length >= 10 && l.length <= 80 && !l.includes('http')) {
        title = l; break;
      }
    }

    // 日期
    const dateMatch = raw.match(/(\d{3,4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/);
    if (dateMatch) {
      let y = parseInt(dateMatch[1]);
      if (y < 200) y += 1911;
      const m = String(dateMatch[2]).padStart(2,'0');
      const d = String(dateMatch[3]).padStart(2,'0');
      document.getElementById('news-date').value = `${y}-${m}-${d}`;
    }

    // 重點句：含關鍵詞的短句
    const keywords = ['表示','指出','說明','強調','呼籲','提醒','達到','成功','首次','首例','創新','榮獲','獲得','治療','手術','預防','健康','病患','醫師','照護','復健'];
    const sentences = raw.split(/[。！？\n]/).map(s => s.trim()).filter(s => s.length >= 15 && s.length <= 70);
    const scored = sentences.map(s => ({
      text: s.replace(/^[\s\-•◆▶→「」]+/, '').trim(),
      score: keywords.reduce((a, k) => a + (s.includes(k) ? 2 : 0), 0)
             + (/\d/.test(s) ? 1 : 0)
             + (s.includes('「') ? 1 : 0)
    })).filter(s => s.text.length >= 10);
    scored.sort((a,b) => b.score - a.score);
    const points = scored.slice(0,4).map(s => s.text);

    if (title) document.getElementById('title').value = title;
    if (points.length) document.getElementById('points').value = points.join('\n');
  }

  // ── Format 多選 ──────────────────────────────────
  function toggleFmt(el) {
    el.classList.toggle('selected');
    el.querySelector('input[type="checkbox"]').checked = el.classList.contains('selected');
  }

  // ── Color 單選 ────────────────────────────────────
  function selectColor(el) {
    document.querySelectorAll('#colorOptions .color-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input[type="radio"]').checked = true;
  }

  // ── CardCount 單選 ────────────────────────────────
  function selectCardCount(el) {
    document.querySelectorAll('input[name="card-count"]').forEach(r => r.closest('.color-option').classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input[type="radio"]').checked = true;
  }

  // ── 清除 ──────────────────────────────────────────
  function clearAll() {
    ['full-text','title','points','quote'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('output').innerHTML = '<span class="output-placeholder">填入左側新聞稿資料後，點「產生提示詞」按鈕。\n\n複製後貼到 Claude、Gemini 或 GPT，AI 會幫你：\n  1. 整理圖卡標題與重點文字\n  2. 建議版面配置與設計細節\n  3. 輸出完整的圖卡文字稿\n\n再將文字稿帶入 Canva / Figma 製作圖卡。</span>';
    document.getElementById('copyBtn').disabled = true;
    generatedPrompt = '';
  }

  // ── 產生提示詞 ────────────────────────────────────
  function generate() {
    const title       = document.getElementById('title').value.trim();
    const points      = document.getElementById('points').value.trim();
    const quote       = document.getElementById('quote').value.trim();
    const color       = document.querySelector('input[name="color"]:checked').value;
    const style       = document.getElementById('design-style').value;
    const pointCount  = document.getElementById('point-count').value;
    const cardCount   = parseInt(document.querySelector('input[name="card-count"]:checked').value);

    const formats = [...document.querySelectorAll('#formatOptions input:checked')].map(i => i.value);

    if (!title) {
      alert('請填入新聞標題！');
      document.getElementById('title').focus();
      return;
    }
    if (!points) {
      alert('請填入新聞重點，或先貼入全文使用自動提取！');
      return;
    }
    if (formats.length === 0) {
      alert('請至少選擇一種圖卡格式！');
      return;
    }

    let prompt = `你是臺中慈濟醫院公傳室的新聞圖卡設計師，請根據以下新聞稿資料，製作一張【${title}】的新聞稿圖卡設計稿。\n\n`;

    prompt += `## 新聞稿資料\n`;
    prompt += `- 標題：${title}\n`;
    prompt += `\n### 新聞重點\n${points}\n`;
    if (quote) prompt += `\n### 關鍵金句\n${quote}\n`;

    prompt += `\n## 圖卡設計規格
- 圖卡數量：${cardCount} 張
- 圖卡格式：${formats.join('、')}
- 配色主題：${color}
- 設計風格：${style}

## 工作任務
請依序完成以下工作：

**1. 分析新聞重點**
從新聞稿資料中提取所有重要資訊，整理成條列清單（每點 12 字以內）。

**2. 標題與副標**
提供 2 組圖卡主標（10–16 字）+ 副標（選填，6–10 字）
- 主標要有新聞感，能引起點閱
- 所有 ${cardCount} 張圖卡共用同一組主標題

**3. 將新聞內容分配到 ${cardCount} 張圖卡**
依新聞內容的主題脈絡，把重點合理分段：

  // ── 複製 ──────────────────────────────────────────
  function copyPrompt() {
    if (!generatedPrompt) return;
    copyText(generatedPrompt, 'copyBtn', '複製提示詞', '已複製！去貼到 AI ✓');
  }

  function copyCardPrompt() {
    // Extract just the card text draft section
    const match = generatedPrompt.match(/```([\s\S]*?)```/);
    if (match) copyText(match[1].trim(), 'copyCardBtn', '複製圖卡文字稿', '已複製圖卡文字稿 ✓');
  }

  function copyText(text, btnId, defaultLabel, copiedLabel) {
    const btn = document.getElementById(btnId);
    const doLabel = () => {
      btn.textContent = copiedLabel;
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = defaultLabel;
        btn.classList.remove('copied');
      }, 2500);
    };
    if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(doLabel).catch(fallback);
    } else { fallback(); }
    function fallback() {
      const el = document.createElement('textarea');
      el.value = text; document.body.appendChild(el);
      el.select(); document.execCommand('copy');
      document.body.removeChild(el); doLabel();
    }
  }
