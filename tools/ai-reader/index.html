<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 書僮 2.0</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    .header {
      text-align: center;
      margin-bottom: 36px;
    }

    h1 {
      font-size: 2rem;
      color: #f5c842;
      letter-spacing: 0.12em;
      text-shadow: 0 0 16px #f5c84244;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #888;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── 輸入區 ── */
    .inputs {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 32px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 560px) {
      .inputs { grid-template-columns: 1fr; }
    }

    .field label {
      display: block;
      font-size: 0.82rem;
      color: #aaa;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: #252525;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.95rem;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: #f5c842;
    }

    .field textarea {
      height: 120px;
      line-height: 1.6;
    }

    .field input::placeholder,
    .field textarea::placeholder {
      color: #555;
      font-size: 0.85rem;
    }

    /* ── Prompt 卡片 ── */
    .stage {
      background: #1c1c1c;
      border: 1px solid #333;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 20px;
      position: relative;
    }

    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .stage-tag {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .stage-1 .stage-tag { background: #2a3a5c; color: #7eb3ff; border: 1px solid #3a5080; }
    .stage-2 .stage-tag { background: #2a3a2a; color: #7eda7e; border: 1px solid #3a5a3a; }
    .stage-3 .stage-tag { background: #3a2a2a; color: #f5a07e; border: 1px solid #5a3a2a; }

    .stage-title {
      font-size: 0.9rem;
      color: #ccc;
      letter-spacing: 0.05em;
    }

    .copy-btn {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 8px;
      color: #ccc;
      cursor: pointer;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 0.82rem;
      padding: 6px 16px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: #333;
      border-color: #f5c842;
      color: #f5c842;
    }

    .copy-btn.copied {
      background: #1a2a1a;
      border-color: #5da55d;
      color: #7eda7e;
    }

    .prompt-box {
      background: #252525;
      border: 1px solid #333;
      border-radius: 8px;
      color: #ddd;
      font-size: 0.88rem;
      line-height: 1.75;
      padding: 16px 18px;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .prompt-box .highlight {
      color: #f5c842;
      font-weight: 700;
    }

    .empty-hint {
      color: #555;
      font-style: italic;
    }
    .back-btn {
      position: fixed; bottom: 20px; left: 20px; z-index: 9999;
      background: rgba(15,17,23,0.88); border: 1px solid #333;
      border-radius: 20px; padding: 6px 14px; color: #888;
      text-decoration: none; font-size: 0.82rem;
      backdrop-filter: blur(8px); transition: color 0.15s, border-color 0.15s;
    }
    .back-btn:hover { color: #eee; border-color: #4f8ef7; }
  </style>
</head>
<body>

<a class="back-btn" href="../pr-dashboard/index.html">← 儀表板</a>

<div class="container">
  <div class="header">
    <h1>📖 AI 書僮 2.0</h1>
    <p class="subtitle">三階段深讀系統｜填入書名與人設，生成 Prompt 直接貼給 AI</p>
  </div>

  <div class="inputs">
    <div class="field">
      <label>📚 書名</label>
      <input id="bookName" type="text" placeholder="例：原子習慣、被討厭的勇氣…" oninput="render()">
    </div>
    <div class="field">
      <label>🧑‍💼 你的人設（給第三階段用）</label>
      <textarea id="persona" placeholder="例：
45歲，國中數學老師
喜歡跑步，習慣用手機學習
想把 AI 工具用在教學上
不太習慣長篇大論" oninput="render()"></textarea>
    </div>
  </div>

  <!-- 第一階段 -->
  <div class="stage stage-1">
    <div class="stage-header">
      <div>
        <span class="stage-tag">第一階段</span>
        &nbsp;
        <span class="stage-title">兩遍深讀｜內容本體</span>
      </div>
      <button class="copy-btn" onclick="copyStage(1, this)">複製</button>
    </div>
    <div class="prompt-box" id="prompt1"></div>
  </div>

  <!-- 第二階段 -->
  <div class="stage stage-2">
    <div class="stage-header">
      <div>
        <span class="stage-tag">第二階段</span>
        &nbsp;
        <span class="stage-title">外部交叉驗證｜共識萃取</span>
      </div>
      <button class="copy-btn" onclick="copyStage(2, this)">複製</button>
    </div>
    <div class="prompt-box" id="prompt2"></div>
  </div>

  <!-- 第三階段 -->
  <div class="stage stage-3">
    <div class="stage-header">
      <div>
        <span class="stage-tag">第三階段</span>
        &nbsp;
        <span class="stage-title">個人化轉化｜實戰落地</span>
      </div>
      <button class="copy-btn" onclick="copyStage(3, this)">複製</button>
    </div>
    <div class="prompt-box" id="prompt3"></div>
  </div>
</div>

<script>
  function getBook() {
    const v = document.getElementById('bookName').value.trim();
    return v || '書名';
  }

  function getPersona() {
    const v = document.getElementById('persona').value.trim();
    return v || '（尚未填寫人設）';
  }

  function buildPrompt1(book) {
    return `你是一位經驗極度豐富的專業導讀專家。

針對《${book}》這本書：

1. 請確認你確實找到這本書，不能憑印象或推測。
2. 必須完整閱讀兩遍以上，再開始整理。
3. 如果找不到這本書，請直接說找不到，不可自行編造。

完成後請輸出：

• 全書摘要（有邏輯架構，不是流水帳）
• 作者核心主張
• 書中最重要的 5–10 個關鍵觀念
• 書中隱含但未明說的底層假設
• 作者可能的盲點或爭議點

完成第一階段後，停止。等待我確認。`;
  }

  function buildPrompt2(book) {
    return `從 YouTube 與網路中：

• 找出 10 支觀看數最高、專門討論《${book}》的影片
• 找出 10 篇被分享或討論度最高的文章

整理出：

• 重複出現最多的觀點
• 外界最認同的部分
• 外界最有爭議的部分
• 哪些觀點被誤解最多
• 有沒有被過度簡化的內容

最後做出：
「《${book}》在公眾世界真正被記住的是什麼？」

完成後停止，等待我確認。`;
  }

  function buildPrompt3(book, persona) {
    return `請根據以下這個人的背景：

${persona}

針對《${book}》這本書：

1. 指出我可能會抗拒的部分
2. 指出我會最容易忽略的部分
3. 設計一套 30 天可落地的日常練習系統
   • 每天 20–30 分鐘即可完成
   • 每週有檢核點
   • 目標是把我的短板變成長板

最後請整理成：

• 行動清單
• 每日練習表
• 一句我可以反覆提醒自己的核心金句`;
  }

  function render() {
    const book = getBook();
    const persona = getPersona();

    document.getElementById('prompt1').textContent = buildPrompt1(book);
    document.getElementById('prompt2').textContent = buildPrompt2(book);
    document.getElementById('prompt3').textContent = buildPrompt3(book, persona);
  }

  function copyStage(n, btn) {
    const book = getBook();
    const persona = getPersona();
    const map = {
      1: buildPrompt1(book),
      2: buildPrompt2(book),
      3: buildPrompt3(book, persona),
    };
    navigator.clipboard.writeText(map[n]).then(() => {
      btn.textContent = '已複製 ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '複製';
        btn.classList.remove('copied');
      }, 2000);
    }).catch(() => {
      btn.textContent = '複製失敗';
      setTimeout(() => { btn.textContent = '複製'; }, 2000);
    });
  }

  // 初始渲染
  render();
</script>
</body>
</html>
