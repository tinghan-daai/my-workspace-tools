<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>內容生產流水線</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b25; --card: #1c2232;
      --border: #253050; --accent: #4f8ef7; --text: #e2e8f5;
      --muted: #6b7a9e; --radius: 14px;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg); color: var(--text); min-height: 100vh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 40px 20px; }
    .card { background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 48px 40px; text-align: center;
      max-width: 480px; width: 100%; }
    .icon { font-size: 3rem; margin-bottom: 20px; }
    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 10px; }
    p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin-bottom: 32px; }
    .badge { display: inline-block; background: #1a2e44; border: 1px solid #2a4a6e;
      color: var(--accent); border-radius: 20px; padding: 4px 14px;
      font-size: 0.78rem; margin-bottom: 32px; }
    .back-btn { display: inline-block; background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 10px 22px;
      text-decoration: none; font-size: 0.9rem; transition: border-color 0.15s; }
    .back-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🗞</div>
    <h1>內容生產流水線</h1>
    <p>素材 → 文稿 Prompt → 圖卡算繪 → docx 存檔，三步驟一條龍</p>
    <div class="badge">🚧 施工中</div>
    <br>
    <a class="back-btn" href="../../tools/pr-dashboard/index.html">← 返回工作儀表板</a>
  </div>
</body>
</html>
