<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File to Markdown</title>
  <meta name="theme-color" content="#4ec9b0">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.7.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.2/dist/turndown.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #f0f0f0;
      font-family: 'Noto Sans TC', sans-serif;
      min-height: 100vh;
      padding: 32px 20px 60px;
    }

    .container { max-width: 820px; margin: 0 auto; }

    .header { text-align: center; margin-bottom: 28px; }

    h1 {
      font-size: 1.9rem;
      color: #4ec9b0;
      letter-spacing: 0.12em;
      text-shadow: 0 0 14px #4ec9b055;
      margin-bottom: 6px;
    }

    .subtitle {
      color: #888;
      font-size: 0.85rem;
      letter-spacing: 0.06em;
    }

    /* ── Drop zone ── */
    .drop-zone {
      width: 100%;
      border: 2px dashed #444;
      border-radius: 14px;
      padding: 44px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: #1a1a1a;
      margin-bottom: 22px;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #4ec9b0;
      background: #1d2a28;
      box-shadow: 0 0 24px #4ec9b022;
    }
    .drop-zone .icon { font-size: 2.4rem; margin-bottom: 10px; color: #4ec9b0; }
    .drop-zone .hint { color: #aaa; font-size: 0.95rem; margin-bottom: 4px; }
    .drop-zone .accept { color: #666; font-size: 0.78rem; letter-spacing: 0.05em; }
    .drop-zone input { display: none; }

    /* ── Settings ── */
    .settings {
      background: #1c1c1c;
      border: 1px solid #2c2c2c;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: center;
    }
    .settings label {
      color: #ccc;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .settings select {
      background: #252525;
      color: #f0f0f0;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 0.88rem;
    }
    .settings input[type=checkbox] { accent-color: #4ec9b0; width: 16px; height: 16px; }

    /* ── Status ── */
    .status {
      background: #1c1c1c;
      border: 1px solid #2c2c2c;
      border-radius: 12px;
      padding: 14px 18px;
      margin-bottom: 22px;
      font-size: 0.88rem;
      color: #bbb;
      display: none;
    }
    .status.show { display: block; }
    .status .file-name { color: #4ec9b0; font-weight: 500; }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #2a2a2a;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar .fill {
      height: 100%;
      background: linear-gradient(90deg, #4ec9b0, #6fdcc6);
      width: 0;
      transition: width 0.3s;
    }
    .log {
      margin-top: 10px;
      max-height: 140px;
      overflow-y: auto;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 0.78rem;
      color: #888;
      background: #0d0d0d;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .log .line { margin-bottom: 2px; }
    .log .line.warn { color: #f5c842; }
    .log .line.err { color: #ff6b6b; }
    .log .line.ok { color: #4ec9b0; }

    /* ── Output ── */
    .output { display: none; }
    .output.show { display: block; }

    .output-toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .btn {
      background: #252525;
      border: 1px solid #3a3a3a;
      color: #f0f0f0;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.88rem;
      transition: all 0.2s;
    }
    .btn:hover { background: #2f2f2f; border-color: #4ec9b0; }
    .btn.primary {
      background: #4ec9b0;
      color: #111;
      border-color: #4ec9b0;
      font-weight: 500;
    }
    .btn.primary:hover { background: #6fdcc6; }

    textarea.md-output {
      width: 100%;
      min-height: 380px;
      background: #0d0d0d;
      border: 1px solid #2c2c2c;
      border-radius: 10px;
      color: #e0e0e0;
      font-family: 'Menlo', 'Consolas', monospace;
      font-size: 0.84rem;
      padding: 14px 16px;
      line-height: 1.55;
      resize: vertical;
      outline: none;
    }
    textarea.md-output:focus { border-color: #4ec9b0; }

    .footer {
      text-align: center;
      margin-top: 36px;
      color: #555;
      font-size: 0.76rem;
      letter-spacing: 0.05em;
    }
    .footer a { color: #777; text-decoration: none; }
    .back-btn {
      position: fixed; top: 14px; left: 16px; z-index: 9999;
      background: rgba(15,17,23,0.88); border: 1px solid #333;
      border-radius: 20px; padding: 6px 14px; color: #888;
      text-decoration: none; font-size: 0.82rem;
      backdrop-filter: blur(8px); transition: color 0.15s, border-color 0.15s;
    }
    .back-btn:hover { color: #eee; border-color: #4f8ef7; }
  </style>
</head>
<body>

<a class="back-btn" href="../pr-dashboard/index.html">← 儀表板</a>

  <div class="container">
    <div class="header">
      <h1>FILE → MARKDOWN</h1>
      <div class="subtitle">PDF / Word / PowerPoint / 圖片 → .md（純瀏覽器，不上傳）</div>
    </div>

    <label class="drop-zone" id="dropZone">
      <div class="icon">📄</div>
      <div class="hint">拖放檔案到這裡，或點擊選檔</div>
      <div class="accept">支援 .pdf / .docx / .pptx / .png / .jpg / .jpeg / .webp</div>
      <input type="file" id="fileInput" accept=".pdf,.docx,.pptx,.png,.jpg,.jpeg,.webp,image/*,application/pdf">
    </label>

    <div class="settings">
      <label>
        OCR 語言
        <select id="ocrLang">
          <option value="chi_tra+eng" selected>繁中 + English</option>
          <option value="chi_sim+eng">簡中 + English</option>
          <option value="eng">English only</option>
          <option value="chi_tra">繁中 only</option>
        </select>
      </label>
      <label>
        OCR 精度
        <select id="ocrPrecision">
          <option value="fast" selected>🐇 快速（fast 模型 / 2x）</option>
          <option value="standard">🐢 標準（fast 模型 / 3x）</option>
          <option value="precise">🎯 精準（best 模型 / 3x，慢但較準）</option>
        </select>
      </label>
      <label>
        <input type="checkbox" id="forceOcr">
        強制 OCR（即使 PDF 有文字層）
      </label>
    </div>

    <div class="status" id="status">
      <div>處理中：<span class="file-name" id="statusFile"></span></div>
      <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
      <div class="log" id="log"></div>
    </div>

    <div class="output" id="output">
      <div class="output-toolbar">
        <button class="btn primary" id="downloadBtn">⬇ 下載 .md</button>
        <button class="btn" id="copyBtn">📋 複製到剪貼簿</button>
        <button class="btn" id="resetBtn">↺ 轉新檔</button>
      </div>
      <textarea class="md-output" id="mdOutput" spellcheck="false"></textarea>
    </div>

    <div class="footer">
      tools/file-to-md · 純前端轉換，所有處理都在你的瀏覽器內
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';

    const $ = (id) => document.getElementById(id);
    const dropZone = $('dropZone');
    const fileInput = $('fileInput');
    const statusBox = $('status');
    const statusFile = $('statusFile');
    const progressFill = $('progressFill');
    const logBox = $('log');
    const outputBox = $('output');
    const mdOutput = $('mdOutput');

    let currentMd = '';
    let currentName = 'output';

    // ── OCR precision helpers ──
    function getPrecision() { return $('ocrPrecision').value; }
    function getRenderScale() { return getPrecision() === 'fast' ? 2 : 3; }

    async function createOcrWorker(lang, onProgress) {
      const precision = getPrecision();
      const opts = {
        logger: (m) => {
          if (m.status === 'recognizing text' && typeof m.progress === 'number' && onProgress) {
            onProgress(m.progress);
          }
        },
      };
      if (precision === 'precise') {
        opts.langPath = 'https://tessdata.projectnaptha.com/4.0.0_best';
        log('使用 best 語言模型（首次下載 ~30-50MB，需耐心等待）', 'warn');
      } else {
        log('使用 fast 語言模型（首次下載 ~10-15MB）', 'warn');
      }
      const worker = await Tesseract.createWorker(lang.split('+'), 1, opts);
      await worker.setParameters({
        preserve_interword_spaces: '1',
      });
      return worker;
    }

    // ── log helpers ──
    function log(msg, cls = '') {
      const line = document.createElement('div');
      line.className = 'line' + (cls ? ' ' + cls : '');
      line.textContent = msg;
      logBox.appendChild(line);
      logBox.scrollTop = logBox.scrollHeight;
    }
    function clearLog() { logBox.innerHTML = ''; }
    function setProgress(pct) { progressFill.style.width = Math.min(100, Math.max(0, pct)) + '%'; }

    // ── drop zone ──
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) handleFile(file);
    });

    // ── output handlers ──
    $('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([mdOutput.value], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentName + '.md';
      a.click();
      URL.revokeObjectURL(url);
    });
    $('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(mdOutput.value);
        const b = $('copyBtn');
        const old = b.textContent;
        b.textContent = '✓ 已複製';
        setTimeout(() => { b.textContent = old; }, 1500);
      } catch (e) {
        mdOutput.select();
        document.execCommand('copy');
      }
    });
    $('resetBtn').addEventListener('click', () => {
      outputBox.classList.remove('show');
      statusBox.classList.remove('show');
      fileInput.value = '';
      mdOutput.value = '';
      currentMd = '';
    });

    // ── main dispatcher ──
    async function handleFile(file) {
      clearLog();
      setProgress(0);
      outputBox.classList.remove('show');
      statusBox.classList.add('show');
      statusFile.textContent = file.name;
      currentName = file.name.replace(/\.[^.]+$/, '');

      const ext = (file.name.split('.').pop() || '').toLowerCase();
      try {
        let md = '';
        if (ext === 'pdf') {
          md = await convertPdf(file);
        } else if (ext === 'docx') {
          md = await convertDocx(file);
        } else if (ext === 'pptx') {
          md = await convertPptx(file);
        } else if (['png', 'jpg', 'jpeg', 'webp', 'bmp', 'gif'].includes(ext)) {
          md = await convertImage(file);
        } else if (ext === 'doc') {
          throw new Error('舊版 .doc 不支援，請另存為 .docx');
        } else if (ext === 'ppt') {
          throw new Error('舊版 .ppt 不支援，請另存為 .pptx');
        } else {
          throw new Error('不支援的檔案格式：' + ext);
        }

        const header = buildHeader(file);
        currentMd = header + md.trim() + '\n';
        mdOutput.value = currentMd;
        outputBox.classList.add('show');
        setProgress(100);
        log('✓ 完成', 'ok');
      } catch (e) {
        console.error(e);
        log('✗ ' + (e.message || e), 'err');
      }
    }

    function buildHeader(file) {
      const now = new Date().toISOString().replace('T', ' ').slice(0, 16);
      const sizeKb = (file.size / 1024).toFixed(1);
      return `# ${currentName}\n\n` +
             `> 來源：\`${file.name}\` (${sizeKb} KB)  \n` +
             `> 轉換時間：${now}  \n` +
             `> 工具：file-to-md\n\n---\n\n`;
    }

    // ── PDF ──
    async function convertPdf(file) {
      log('讀取 PDF…');
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      log(`共 ${pdf.numPages} 頁`);

      const forceOcr = $('forceOcr').checked;
      const lang = $('ocrLang').value;
      const renderScale = getRenderScale();
      let ocrWorker = null;

      const ensureWorker = async () => {
        if (ocrWorker) return ocrWorker;
        log('初始化 OCR…', 'warn');
        ocrWorker = await createOcrWorker(lang);
        log('OCR 就緒', 'ok');
        return ocrWorker;
      };

      const parts = [];
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        let pageText = '';

        if (!forceOcr) {
          const tc = await page.getTextContent();
          pageText = textContentToLines(tc).join('\n');
        }

        if (forceOcr || pageText.replace(/\s/g, '').length < 8) {
          if (!forceOcr) log(`第 ${i} 頁文字稀少，改用 OCR`, 'warn');
          const w = await ensureWorker();
          const viewport = page.getViewport({ scale: renderScale });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
          const { data: { text } } = await w.recognize(canvas);
          pageText = text.trim();
        }

        parts.push(`## 第 ${i} 頁\n\n${pageText.trim()}\n`);
        log(`第 ${i}/${pdf.numPages} 頁完成`);
        setProgress((i / pdf.numPages) * 95);
      }

      if (ocrWorker) await ocrWorker.terminate();
      return parts.join('\n');
    }

    // Group pdf.js text items into visual lines by Y coord
    function textContentToLines(tc) {
      const items = tc.items;
      if (!items.length) return [];
      const lines = [];
      let curY = null;
      let cur = '';
      for (const it of items) {
        const y = it.transform[5];
        if (curY === null) {
          curY = y;
          cur = it.str;
        } else if (Math.abs(y - curY) > 2) {
          lines.push(cur.trim());
          cur = it.str;
          curY = y;
        } else {
          cur += it.str;
        }
        if (it.hasEOL) {
          lines.push(cur.trim());
          cur = '';
          curY = null;
        }
      }
      if (cur) lines.push(cur.trim());
      return lines.filter((l) => l.length > 0);
    }

    // ── DOCX ──
    async function convertDocx(file) {
      log('解析 Word 文件…');
      const buffer = await file.arrayBuffer();
      setProgress(20);
      const result = await mammoth.convertToHtml({ arrayBuffer: buffer });
      setProgress(60);
      if (result.messages?.length) {
        for (const m of result.messages.slice(0, 5)) log('· ' + m.message, 'warn');
      }
      const td = new TurndownService({
        headingStyle: 'atx',
        codeBlockStyle: 'fenced',
        bulletListMarker: '-',
      });
      const md = td.turndown(result.value);
      setProgress(95);
      return md;
    }

    // ── PPTX ──
    async function convertPptx(file) {
      log('解析 PowerPoint…');
      const buffer = await file.arrayBuffer();
      const zip = await JSZip.loadAsync(buffer);

      const slideNames = Object.keys(zip.files)
        .filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n))
        .sort((a, b) => {
          const na = parseInt(a.match(/slide(\d+)/)[1], 10);
          const nb = parseInt(b.match(/slide(\d+)/)[1], 10);
          return na - nb;
        });

      log(`共 ${slideNames.length} 張投影片`);
      const parts = [];
      for (let i = 0; i < slideNames.length; i++) {
        const xml = await zip.file(slideNames[i]).async('string');
        const lines = pptxSlideToLines(xml);
        const body = lines.length
          ? lines.map((l) => '- ' + l).join('\n')
          : '_(此頁無文字)_';
        parts.push(`## Slide ${i + 1}\n\n${body}\n`);
        setProgress(((i + 1) / slideNames.length) * 95);
      }
      return parts.join('\n');
    }

    function pptxSlideToLines(xml) {
      // Each <a:p> is a paragraph (one bullet line); <a:t> are text runs
      const paras = xml.split(/<a:p[\s>]/).slice(1);
      const lines = [];
      for (const p of paras) {
        const runs = [...p.matchAll(/<a:t[^>]*>([\s\S]*?)<\/a:t>/g)].map((m) =>
          decodeXmlEntities(m[1])
        );
        const line = runs.join('').replace(/\s+/g, ' ').trim();
        if (line) lines.push(line);
      }
      return lines;
    }

    function decodeXmlEntities(s) {
      return s
        .replace(/&lt;/g, '<')
        .replace(/&gt;/g, '>')
        .replace(/&quot;/g, '"')
        .replace(/&apos;/g, "'")
        .replace(/&amp;/g, '&');
    }

    // ── Image ──
    async function convertImage(file) {
      log('OCR 圖片…');
      const lang = $('ocrLang').value;
      const worker = await createOcrWorker(lang, (p) => setProgress(20 + p * 75));
      const url = URL.createObjectURL(file);
      const { data: { text } } = await worker.recognize(url);
      URL.revokeObjectURL(url);
      await worker.terminate();
      return text.trim();
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
