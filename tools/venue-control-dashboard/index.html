<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>台日長照論壇｜會場設計物管制工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">台日長照論壇</p>
        <h1>會場設計物管制工具</h1>
      </div>
      <div class="actions">
        <a id="backDashboard" class="button-link" href="../pr-dashboard/index.html">← 回儀表板</a>
        <button id="exportCsv" type="button">匯出 CSV</button>
        <button id="resetData" type="button" class="secondary">重設資料</button>
      </div>
    </header>

    <main>
      <section class="kpis" aria-label="管制總覽">
        <article class="kpi">
          <span>總件數</span>
          <strong id="totalCount">0</strong>
        </article>
        <article class="kpi">
          <span>已完成</span>
          <strong id="doneCount">0</strong>
        </article>
        <article class="kpi warning">
          <span>紅/黃燈</span>
          <strong id="riskCount">0</strong>
        </article>
        <article class="kpi">
          <span>本週到期</span>
          <strong id="weekDueCount">0</strong>
        </article>
        <article class="kpi">
          <span>未指派</span>
          <strong id="unassignedCount">0</strong>
        </article>
      </section>

      <section class="toolbar" aria-label="篩選工具">
        <label>
          搜尋
          <input id="searchInput" type="search" placeholder="輸入類別、內容、負責人或下一步" />
        </label>
        <label>
          狀態
          <select id="statusFilter">
            <option value="all">全部</option>
            <option>未開始</option>
            <option>設計中</option>
            <option>待確認</option>
            <option>已送印</option>
            <option>已完成</option>
            <option>卡關</option>
          </select>
        </label>
        <label>
          風險
          <select id="riskFilter">
            <option value="all">全部</option>
            <option>紅燈</option>
            <option>黃燈</option>
            <option>綠燈</option>
          </select>
        </label>
        <label>
          類別
          <select id="categoryFilter">
            <option value="all">全部</option>
          </select>
        </label>
      </section>

      <section class="layout">
        <aside class="panel">
          <h2>優先處理</h2>
          <div id="priorityList" class="priority-list"></div>
        </aside>

        <section class="panel table-panel">
          <div class="table-head">
            <h2>管制清單</h2>
            <span id="visibleCount">0 筆</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>類別</th>
                  <th>序</th>
                  <th>內容</th>
                  <th>數量</th>
                  <th>尺寸</th>
                  <th>狀態</th>
                  <th>優先</th>
                  <th>負責人</th>
                  <th>期限</th>
                  <th>風險</th>
                  <th>下一步</th>
                </tr>
              </thead>
              <tbody id="itemRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    <template id="emptyState">
      <div class="empty">目前沒有符合條件的設計物。</div>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
