<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>衛教圖卡產生器 — 公傳室</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b25;
      --card: #1c2232;
      --border: #253050;
      --accent: #4f8ef7;
      --accent2: #3ecf8e;
      --accent3: #f5a623;
      --accent4: #c47af7;
      --text: #e2e8f5;
      --muted: #6b7a9e;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 28px 20px 100px;
    }

    h1 {
      max-width: 960px;
      margin: 0 auto 6px;
      font-size: 1.3rem;
      font-weight: 700;
    }
    h1 span { color: var(--accent2); }

    .subtitle {
      max-width: 960px;
      margin: 0 auto 24px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .layout {
      max-width: 960px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    @media (max-width: 680px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .panel-title {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin-bottom: 2px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 5px;
    }
    label span.req { color: var(--accent3); margin-left: 2px; }

    input[type="text"], textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 0.9rem;
      padding: 9px 12px;
      font-family: inherit;
      outline: none;
      resize: vertical;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus, textarea:focus, select:focus {
      border-color: var(--accent);
    }

    /* 配色主題選擇 */
    .color-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .color-option {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      transition: border-color 0.15s;
      font-size: 0.82rem;
    }
    .color-option:hover { border-color: var(--accent); }
    .color-option input[type="radio"] { display: none; }
    .color-option.selected { border-color: var(--accent); background: rgba(79,142,247,0.08); }

    .swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .sw-teal   { background: linear-gradient(135deg, #1a9c8a, #2b6cb0); }
    .sw-orange { background: linear-gradient(135deg, #f97316, #f5a623); }
    .sw-green  { background: linear-gradient(135deg, #22c55e, #16a34a); }
    .sw-purple { background: linear-gradient(135deg, #a78bfa, #7c3aed); }

    /* 重點數量＋尺寸排成一行 */
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 輸出區 */
    .output-box {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 0.82rem;
      line-height: 1.7;
      color: #a8b5d0;
      white-space: pre-wrap;
      word-break: break-all;
      min-height: 320px;
      overflow-y: auto;
    }
    .output-placeholder {
      color: var(--muted);
      font-style: italic;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent2); color: #0d1117; }
    .btn-copy    { background: var(--surface); border: 1px solid var(--border); color: var(--text); }
    .btn-copy.copied { border-color: var(--accent2); color: var(--accent2); }
    .btn:hover { opacity: 0.88; }

    /* 返回按鈕 */
    .back-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.82rem;
      padding: 8px 14px;
      transition: color 0.15s, border-color 0.15s;
      z-index: 100;
    }
    .back-btn:hover { color: var(--text); border-color: var(--accent); }
  </style>
</head>
<body>

<h1>🩺 衛教<span>圖卡</span>產生器</h1>
<p class="subtitle">輸入衛教文章 → 生成設計提示詞 → 貼到 Claude 取得圖卡內容與設計建議</p>

<div class="layout">

  <!-- 左：輸入 -->
  <div class="panel">
    <div class="panel-title">輸入資料</div>

    <div>
      <label>衛教主題<span class="req">*</span></label>
      <input type="text" id="topic" placeholder="例：糖尿病飲食控制、心肌梗塞預防、傷口照護" />
    </div>

    <div>
      <label>目標受眾</label>
      <select id="audience">
        <option value="一般民眾">一般民眾</option>
        <option value="長者（65歲以上）">長者（65歲以上）</option>
        <option value="兒童與家長">兒童與家長</option>
        <option value="慢性病患者">慢性病患者（糖尿病、高血壓等）</option>
        <option value="術後病患與家屬">術後病患與家屬</option>
        <option value="孕婦與新手父母">孕婦與新手父母</option>
      </select>
    </div>

    <div>
      <label>衛教文章原文（貼上後 AI 自動摘要）</label>
      <textarea id="article" rows="6" placeholder="將衛教文章、衛教單張文字貼入此處，Claude 會從中提取重點…"></textarea>
    </div>

    <div>
      <label>額外強調的重點 <small style="font-size:0.78rem;color:var(--muted)">（選填，一行一點）</small></label>
      <textarea id="extra" rows="3" placeholder="例：&#10;每天量血壓，記錄數值&#10;避免高鹽、高油食物&#10;有不適立即回診"></textarea>
    </div>

    <div class="row-2">
      <div>
        <label>重點數量</label>
        <select id="pointCount">
          <option value="3">3 點</option>
          <option value="4" selected>4 點</option>
          <option value="5">5 點</option>
          <option value="6">6 點</option>
        </select>
      </div>
      <div>
        <label>圖卡尺寸</label>
        <select id="size">
          <option value="1080×1080px（正方形，Instagram）">1080×1080px（正方形）</option>
          <option value="1080×1350px（直式，Instagram）">1080×1350px（直式）</option>
          <option value="1080×1920px（限時動態／Reels）">1080×1920px（限時動態）</option>
          <option value="A4 直向（210×297mm，列印版）">A4 直向（列印版）</option>
          <option value="橫式 16:9（1920×1080px，電視牆）">橫式 16:9（電視牆）</option>
        </select>
      </div>
    </div>

    <div>
      <label>配色主題</label>
      <div class="color-options" id="colorOptions">
        <label class="color-option selected" onclick="selectColor(this)">
          <input type="radio" name="color" value="慈濟藍綠（沉穩專業）" checked />
          <span class="swatch sw-teal"></span>慈濟藍綠
        </label>
        <label class="color-option" onclick="selectColor(this)">
          <input type="radio" name="color" value="暖橘療癒（溫暖親切）" />
          <span class="swatch sw-orange"></span>暖橘療癒
        </label>
        <label class="color-option" onclick="selectColor(this)">
          <input type="radio" name="color" value="清新健康綠（活力輕盈）" />
          <span class="swatch sw-green"></span>清新健康綠
        </label>
        <label class="color-option" onclick="selectColor(this)">
          <input type="radio" name="color" value="柔和粉紫（溫柔舒緩）" />
          <span class="swatch sw-purple"></span>柔和粉紫
        </label>
      </div>
    </div>

    <div>
      <label>設計風格</label>
      <select id="style">
        <option value="醫療專業風（圖示清晰、文字為主）">醫療專業風</option>
        <option value="溫馨插圖風（手繪風插圖、柔和線條）" selected>溫馨插圖風</option>
        <option value="簡約現代風（大量留白、資訊層次清晰）">簡約現代風</option>
        <option value="資訊圖表風（Icon+數字、視覺化呈現）">資訊圖表風</option>
      </select>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" onclick="generate()">🪄 產生提示詞</button>
    </div>
  </div>

  <!-- 右：輸出 -->
  <div class="panel">
    <div class="panel-title">產生的提示詞</div>
    <div class="output-box" id="output">
      <span class="output-placeholder">填入左側資料後，點「產生提示詞」，\n複製後貼到 Claude 即可取得衛教圖卡設計建議。</span>
    </div>
    <div class="btn-row">
      <button class="btn btn-copy" id="copyBtn" onclick="copyPrompt()" disabled>複製提示詞</button>
    </div>
    <p style="font-size:0.76rem;color:var(--muted);line-height:1.6;">
      💡 <strong>使用方式：</strong>複製後開啟 Claude 對話貼入，Claude 會幫你提取重點並提供圖卡文字稿與設計建議，再帶入設計軟體製作。
    </p>
  </div>

</div>

<a class="back-btn" href="index.html">← 儀表板</a>

<script>
  let generatedPrompt = '';

  function selectColor(el) {
    document.querySelectorAll('.color-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input[type="radio"]').checked = true;
  }

  function generate() {
    const topic     = document.getElementById('topic').value.trim();
    const audience  = document.getElementById('audience').value;
    const article   = document.getElementById('article').value.trim();
    const extra     = document.getElementById('extra').value.trim();
    const count     = document.getElementById('pointCount').value;
    const size      = document.getElementById('size').value;
    const color     = document.querySelector('input[name="color"]:checked').value;
    const style     = document.getElementById('style').value;

    if (!topic) {
      alert('請填入衛教主題！');
      document.getElementById('topic').focus();
      return;
    }
    if (!article && !extra) {
      alert('請貼入衛教文章原文，或填入想強調的重點！');
      return;
    }

    let prompt = `你是一位醫療衛教設計專家，請根據以下資料，為台中慈濟醫院製作一張【${topic}】衛教圖卡的設計稿。\n\n`;

    if (article) {
      prompt += `## 衛教文章原文\n${article}\n\n`;
    }

    if (extra) {
      prompt += `## 額外需強調的重點\n${extra}\n\n`;
    }

    prompt += `## 圖卡設計規格
- 目標受眾：${audience}
- 圖卡尺寸：${size}
- 配色主題：${color}
- 設計風格：${style}
- 衛教重點數量：${count} 點

## 工作任務
請依序完成以下工作：

**1. 提取衛教重點（${count} 點）**
從文章中提取最重要的 ${count} 個衛教重點，每點須符合：
- 15 字以內的白話文，適合${audience}理解
- 以具體行動或事實為主（例：「每天喝水 2000cc」、「血壓超過 140 立即就醫」）
- 避免艱澀醫療術語，若必須使用請加括號說明

**2. 標題建議**
提供 2 個圖卡主標題選項（8～12字），要吸引人、有感召力

**3. 設計說明**
描述圖卡版面配置建議，包括：
- 區塊劃分方式（頂部、主體、底部各放什麼）
- 配色應用方式（背景色、強調色、文字色）
- 字型大小層次建議
- 推薦使用的圖示風格（如 Flaticon 關鍵字建議）

**4. 完整圖卡文字稿**
請用 Markdown 格式輸出圖卡上的完整文字內容：
\`\`\`
【主標題】
【副標題（選填）】

✅ 重點一
✅ 重點二
✅ 重點三
${count > 3 ? '✅ 重點四\n' : ''}${count > 4 ? '✅ 重點五\n' : ''}${count > 5 ? '✅ 重點六\n' : ''}
【底部】台中慈濟醫院｜[科別名稱]
\`\`\`

## 文字風格規範
- 語氣親切溫和，像照顧家人一樣說話
- 重點句要簡短有力、易記憶
- 加入一句關懷或鼓勵語作為結尾（底部小字）
- 底部固定加上「台中慈濟醫院」`;

    generatedPrompt = prompt;
    document.getElementById('output').textContent = prompt;

    const copyBtn = document.getElementById('copyBtn');
    copyBtn.disabled = false;
    copyBtn.textContent = '複製提示詞';
    copyBtn.classList.remove('copied');
  }

  function copyPrompt() {
    if (!generatedPrompt) return;
    navigator.clipboard.writeText(generatedPrompt).then(() => {
      const btn = document.getElementById('copyBtn');
      btn.textContent = '已複製！去貼到 Claude ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '複製提示詞';
        btn.classList.remove('copied');
      }, 3000);
    }).catch(() => {
      // Fallback for non-HTTPS
      const el = document.createElement('textarea');
      el.value = generatedPrompt;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
      const btn = document.getElementById('copyBtn');
      btn.textContent = '已複製！去貼到 Claude ✓';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '複製提示詞';
        btn.classList.remove('copied');
      }, 3000);
    });
  }
</script>
</body>
</html>
