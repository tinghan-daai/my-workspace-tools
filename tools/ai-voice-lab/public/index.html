<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 聲音實驗室</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◉</span>
      <div>
        <h1>AI 聲音實驗室</h1>
        <p class="sub">Fish Audio S2.1 Pro · 聲音克隆與跨語言口播生成</p>
      </div>
    </div>

    <div class="key-box">
      <label for="apiKey">Fish Audio API Key</label>
      <div class="key-row">
        <input id="apiKey" type="password" placeholder="貼上你的免費 API Key" autocomplete="off" />
        <button id="toggleKey" class="ghost-btn" type="button" title="顯示／隱藏">👁</button>
      </div>
      <label class="remember">
        <input id="rememberKey" type="checkbox" />
        記住在這台裝置（存於瀏覽器 localStorage）
      </label>
      <a class="key-link" href="https://fish.audio/app/api-keys/" target="_blank" rel="noopener">還沒有 Key？前往 fish.audio 免費申請 →</a>
    </div>
  </header>

  <div id="banner" class="banner hidden"></div>

  <main class="grid">

    <!-- 左：聲線來源 -->
    <section class="card">
      <div class="card-head">
        <h2>1. 選擇聲線</h2>
        <div class="tabs">
          <button class="tab-btn active" data-tab="clone">克隆我的聲音</button>
          <button class="tab-btn" data-tab="library">內建聲線庫</button>
        </div>
      </div>

      <div class="tab-panel" data-panel="clone">
        <p class="hint">上傳約 10 秒、清晰無雜音的個人聲音樣本，即可建立專屬聲線。</p>
        <input id="voiceFile" type="file" accept="audio/*" />
        <div id="fileName" class="file-name"></div>
        <input id="cloneTitle" type="text" placeholder="幫這個聲線取個名字（選填）" />
        <button id="cloneBtn" class="primary-btn" type="button">建立克隆聲線</button>
        <div class="divider"></div>
        <div class="list-head">
          <h3>我建立過的聲線</h3>
          <button id="refreshMine" class="ghost-btn small" type="button">↻ 重新整理</button>
        </div>
        <div id="myVoices" class="voice-list"></div>
      </div>

      <div class="tab-panel hidden" data-panel="library">
        <div class="search-row">
          <input id="librarySearch" type="text" placeholder="搜尋聲線庫（例如：新聞、溫柔、男聲）" />
          <button id="searchBtn" class="ghost-btn" type="button">搜尋</button>
        </div>
        <div id="libraryVoices" class="voice-list"></div>
      </div>

      <div class="selected-voice">
        目前選擇的聲線：<strong id="selectedVoiceLabel">尚未選擇</strong>
      </div>
    </section>

    <!-- 右：文字轉語音 -->
    <section class="card">
      <div class="card-head">
        <h2>2. 輸入台詞／文章</h2>
      </div>

      <textarea id="ttsText" rows="8" placeholder="貼上中文台詞，或貼上英文文章 — 會用同一個聲線跨語言生成口播。"></textarea>
      <div class="char-count"><span id="charCount">0</span> 字</div>

      <div class="tag-row">
        <span class="hint inline">插入情緒／語氣標籤：</span>
        <select id="emotionSelect">
          <option value="">— 選擇標籤 —</option>
          <optgroup label="情緒">
            <option value="happy">開心 [happy]</option>
            <option value="sad">難過 [sad]</option>
            <option value="angry">生氣 [angry]</option>
            <option value="excited">興奮 [excited]</option>
            <option value="calm">平靜 [calm]</option>
            <option value="nervous">緊張 [nervous]</option>
            <option value="confident">自信 [confident]</option>
            <option value="surprised">驚訝 [surprised]</option>
            <option value="worried">擔心 [worried]</option>
            <option value="curious">好奇 [curious]</option>
            <option value="grateful">感謝 [grateful]</option>
            <option value="relaxed">放鬆 [relaxed]</option>
          </optgroup>
          <optgroup label="語氣">
            <option value="in a hurry tone">匆忙 [in a hurry tone]</option>
            <option value="shouting">大喊 [shouting]</option>
            <option value="whispering">耳語 [whispering]</option>
            <option value="soft tone">溫柔語氣 [soft tone]</option>
            <option value="emphasis">加重語氣 [emphasis]</option>
          </optgroup>
          <optgroup label="音效">
            <option value="laughing">笑聲 [laughing]</option>
            <option value="sighing">嘆氣 [sighing]</option>
            <option value="break">停頓 [break]</option>
          </optgroup>
        </select>
        <button id="insertTagBtn" class="ghost-btn small" type="button">插入到游標處</button>
      </div>

      <div class="controls">
        <div class="control">
          <label for="speed">語速 <span id="speedVal">1.00</span>x</label>
          <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1" />
        </div>
        <div class="control">
          <label for="format">輸出格式</label>
          <select id="format">
            <option value="mp3" selected>MP3</option>
            <option value="wav">WAV</option>
            <option value="opus">Opus</option>
          </select>
        </div>
      </div>

      <details class="advanced">
        <summary>進階參數</summary>
        <div class="controls">
          <div class="control">
            <label for="temperature">表現力 Temperature <span id="tempVal">0.70</span></label>
            <input id="temperature" type="range" min="0" max="1" step="0.05" value="0.7" />
          </div>
          <div class="control">
            <label for="topP">多樣性 Top-P <span id="topPVal">0.70</span></label>
            <input id="topP" type="range" min="0" max="1" step="0.05" value="0.7" />
          </div>
        </div>
      </details>

      <button id="generateBtn" class="primary-btn wide" type="button">
        <span id="generateLabel">生成語音</span>
      </button>

      <div id="player" class="player hidden">
        <audio id="audioEl" controls></audio>
        <a id="downloadLink" class="ghost-btn" download>⬇ 下載音檔</a>
      </div>
    </section>

  </main>

  <footer class="foot">純前端介面 + 本地小型代理伺服器（因 Fish Audio API 不開放瀏覽器直接跨網域呼叫）。API Key 只留在你的瀏覽器與這台伺服器之間傳遞，不會被記錄。</footer>
</div>

<script src="app.js"></script>
</body>
</html>
